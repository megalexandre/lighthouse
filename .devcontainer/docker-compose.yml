# Two containers: "app" (where you write and run the Flutter code)
# and "jellyfin" (a real server for the app to talk to).
# ${...} values come from .devcontainer/.env, written by initialize.sh.

# Fixed project name. Without it, Compose names the project after the folder,
# and VS Code and the terminal pick different names: you end up with two copies
# of the containers fighting over port 8096.
name: jellyfin-dev

services:
  app:
    # Explicit name: docker-compose over the podman socket would otherwise tag
    # it docker.io/library/jellyfin-dev-app, but the devcontainer CLI looks for
    # localhost/jellyfin-dev-app and tries to pull it (connection refused).
    image: localhost/jellyfin-dev-app
    build:
      context: .
      args:
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
    
    # Rootless podman maps your host user to root inside the container, so the
    # bind-mounted repo shows up owned by root and "dev" cannot read folders
    # like third_party/media_kit_video (mode 700): pub get and analyze fail.
    # keep-id maps your host uid/gid to the same ids in here, i.e. to "dev".
    # Podman only; plain Docker rejects it (and does not need it).
    userns_mode: keep-id
    
    volumes:
      # The whole workspace, read/write. Same layout as on the host:
      #   /workspace/lighthouse      the Flutter client (we work here)
      #   /workspace/related-repos   jellyfin and jellyfin-desktop, reference
      #                              only; related_repos.sh keeps them current
      - ..:/workspace
      # Dart package cache survives container rebuilds.
      - pub-cache:/home/dev/.pub-cache
      # Gradle's cache too (~1 GB on the first Android build).
      - gradle-cache:/home/dev/.gradle
      # Claude Code: login, settings and session history survive rebuilds.
      - claude-config:/home/dev/.claude
      # Display and audio sockets from the host, so the app window opens
      # on your screen and sound plays on your speakers.
      #   X11:                /tmp/.X11-unix
      #   Wayland, PipeWire:  the runtime dir (/run/user/<uid>)
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR}:/run/user/${USER_UID}
    # Secrets (API keys) live in secrets.env, kept out of git: .env cannot hold
    # them, initialize.sh rewrites it on every start. Optional, so a fresh
    # clone (or CI) starts without one; see secrets.env.example for the names.
    env_file:
      - path: secrets.env
        required: false
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /run/user/${USER_UID}
      # Where the app finds the test server (service name = hostname).
      JELLYFIN_URL: http://jellyfin:8096
      # Throwaway server used by the automated tests (see "jellyfin-test").
      JELLYFIN_TEST_URL: http://jellyfin-test:8096
      # Claude Code keeps everything here, including .claude.json, which by
      # default sits loose in $HOME and would be lost on rebuild.
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      # The container's own session bus, started by keyring.sh. The host's
      # bus (in XDG_RUNTIME_DIR) is denied to containers by AppArmor.
      DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/jellyfin-dev-dbus/bus
    # No ADB_SERVER_SOCKET here: while the host's adb server is down, adb
    # fails and Flutter's device discovery fails with it, Linux included
    # (flutter run -d linux, the integration tests). It is set per terminal,
    # only to use the emulator on the host. See README.md, "Android".
    # host.docker.internal is not defined on Linux unless asked for.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # GPU, for hardware video decoding (VAAPI).
    # On a machine without /dev/dri, delete these two blocks.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${RENDER_GID}
    security_opt:
      # Lets the container use the host sockets on SELinux hosts (Fedora).
      - label=disable
    depends_on:
      - jellyfin
      - jellyfin-test



  jellyfin:
    # Latest stable server. The source in ../related-repos/jellyfin is master (13.x),
    # so small API differences between the two are expected.
    image: jellyfin/jellyfin:12.4
    volumes:
      # Server settings and users, kept between restarts.
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # The generated fixtures (movies, a show, an album), the same media the
      # test server uses. tool/dev_server.sh creates one library per folder.
      - ../lighthouse/fixtures/media:/media:ro
    ports:
      # Also reachable from the host at http://localhost:8096
      - "8096:8096"

  jellyfin-test:
    # Same server, only for the automated tests. Its settings live in memory
    # (tmpfs), so every restart starts from an empty, unconfigured server;
    # the tests run the setup wizard and create the libraries themselves.
    # No published port: only the app container talks to it.
    image: jellyfin/jellyfin:12.4
    tmpfs:
      - /config
      - /cache
    volumes:
      # Generated test media (tool/gen_fixtures.sh), committed in the repo.
      - ../lighthouse/fixtures/media:/media:ro

volumes:
  pub-cache:
  gradle-cache:
  claude-config:
  jellyfin-config:
  jellyfin-cache:
