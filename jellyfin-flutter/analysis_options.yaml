include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - linux/**
    - packages/**
    # Vendored upstream code, kept as upstream wrote it (third_party/README.md).
    - third_party/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
