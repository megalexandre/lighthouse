name: lighthouse
description: "Lighthouse: a Jellyfin desktop client in Flutter."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  # The app's texts in English and Brazilian Portuguese (l10n.yaml, lib/l10n).
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  material_ui: ^1.1.0

  # State and dependency injection; tests swap real services for fakes
  # through provider overrides.
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  # Playback (libmpv)
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_linux: ^1.2.1
  flutter_secure_storage: ^11.2.0
  # Book reader: PDF pages (PDFium), comics (CBZ = a zip of images).
  # Pinned: versions with a few weeks of use behind them.
  pdfrx: 2.11.0
  archive: 4.6.0
  # EPUB: the package files (container.xml, the OPF) are strict XML; the
  # chapters are parsed leniently, as browsers do (real books are sloppy).
  xml: 7.1.0
  html: 0.15.7
  # Where downloaded books are cached.
  path_provider: ^2.1.6
  window_manager: ^0.7.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  mocktail: ^1.0.4
  # Fake clock for timers (PlaybackReporter's 10 s progress reports).
  fake_async: ^1.3.3
  # Behaviour scenarios in Gherkin (test/**/*.feature): build_runner turns
  # each into a widget test; steps in test/step/. Pinned: a version with a
  # few weeks of use behind it.
  bdd_widget_test: 3.0.4
  # Sets up the throwaway test server (JELLYFIN_TEST_URL).
  jellyfin_test_server:
    path: packages/jellyfin_test_server

flutter:
  uses-material-design: true
  # flutter gen-l10n on every build (l10n.yaml).
  generate: true
  shaders:
    - shaders/page_curl.frag
  # Built-in themes: design-system tokens.json files (docs/THEMES.md).
  assets:
    - assets/themes/
  # The faces the built-in themes name (assets/fonts/README.md).
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono-Medium.ttf
          weight: 500
    # The Prime theme's face.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# media_kit_video with a patch for video on Wayland: see third_party/README.md.
dependency_overrides:
  media_kit_video:
    path: third_party/media_kit_video
